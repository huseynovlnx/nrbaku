name: couple_app
description: "NrBaku - Cihaz nəzarət sistemi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.3

  # Konum
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Xəritə
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State
  flutter_riverpod: ^2.5.1

  # UI / Media
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.1.0
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  sqflite: ^2.4.1
  android_intent_plus: ^5.2.0
  path: ^1.9.0
  http: ^1.2.2

  # List müqayisəsi (NotificationVaultRepository üçün)
  collection: ^1.18.0

  # Hash (ReminderAlarmService MD5 üçün)
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
